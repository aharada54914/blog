<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="名刺管理PWA - ビジネスカードを簡単に管理" />
  <meta name="theme-color" content="#1a73e8" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>名刺管理</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">
        <span class="header-icon">📇</span>
        名刺管理
      </h1>
      <div class="header-actions">
        <button id="btn-search-toggle" class="icon-btn" aria-label="検索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </button>
        <button id="btn-theme" class="icon-btn" aria-label="ダークモードに切り替え">
          <!-- Moon: shown in light mode -->
          <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sun: shown in dark mode -->
          <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button id="btn-add" class="icon-btn primary" aria-label="名刺を追加">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search bar -->
    <div id="search-bar" class="search-bar hidden">
      <input id="search-input" type="search" placeholder="名前・会社名・メールで検索..." autocomplete="off" />
    </div>

    <!-- Sort bar -->
    <div class="sort-bar" role="group" aria-label="並び替え">
      <button class="sort-chip active" data-sort="createdAt">登録日</button>
      <button class="sort-chip" data-sort="name">名前順</button>
      <button class="sort-chip" data-sort="company">会社順</button>
    </div>
  </header>

  <!-- Main content -->
  <main class="main">
    <!-- Empty state -->
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-icon">📭</div>
      <p class="empty-title">名刺がありません</p>
      <p class="empty-sub">右上の＋ボタンで名刺を追加しましょう</p>
    </div>

    <!-- Card list -->
    <ul id="card-list" class="card-list" role="list"></ul>
  </main>

  <!-- FAB (mobile) -->
  <button id="fab" class="fab" aria-label="名刺を追加">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Modal: Add / Edit -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">名刺を追加</h2>
        <button id="btn-modal-close" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="card-form" novalidate>
        <input type="hidden" id="form-id" />

        <!-- Photo -->
        <div class="form-photo-area">
          <div id="photo-preview" class="photo-preview">
            <span class="photo-placeholder">👤</span>
          </div>
          <label for="form-photo" class="photo-label">写真を選択</label>
          <input id="form-photo" type="file" accept="image/*" capture="environment" class="visually-hidden" />
        </div>

        <div class="form-grid">
          <div class="form-group full">
            <label for="form-name">氏名 <span class="required">*</span></label>
            <input id="form-name" type="text" placeholder="山田 太郎" required autocomplete="name" />
            <span class="field-error" id="err-name"></span>
          </div>
          <div class="form-group full">
            <label for="form-furigana">フリガナ</label>
            <input id="form-furigana" type="text" placeholder="ヤマダ タロウ" autocomplete="off" />
          </div>
          <div class="form-group full">
            <label for="form-company">会社名</label>
            <input id="form-company" type="text" placeholder="株式会社サンプル" autocomplete="organization" />
          </div>
          <div class="form-group">
            <label for="form-department">部署</label>
            <input id="form-department" type="text" placeholder="営業部" autocomplete="organization-title" />
          </div>
          <div class="form-group">
            <label for="form-position">役職</label>
            <input id="form-position" type="text" placeholder="部長" />
          </div>
          <div class="form-group full">
            <label for="form-email">メールアドレス</label>
            <input id="form-email" type="email" placeholder="taro@example.com" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="form-phone">電話番号</label>
            <input id="form-phone" type="tel" placeholder="03-1234-5678" autocomplete="tel" />
          </div>
          <div class="form-group">
            <label for="form-mobile">携帯番号</label>
            <input id="form-mobile" type="tel" placeholder="090-1234-5678" autocomplete="tel" />
          </div>
          <div class="form-group full">
            <label for="form-address">住所</label>
            <input id="form-address" type="text" placeholder="東京都千代田区..." autocomplete="street-address" />
          </div>
          <div class="form-group full">
            <label for="form-website">ウェブサイト</label>
            <input id="form-website" type="url" placeholder="https://example.com" autocomplete="url" />
          </div>
          <div class="form-group full">
            <label for="form-tags">タグ（カンマ区切り）</label>
            <input id="form-tags" type="text" placeholder="IT, 取引先, 重要" />
          </div>
          <div class="form-group full">
            <label for="form-notes">メモ</label>
            <textarea id="form-notes" placeholder="備考・メモ..." rows="3"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel" class="btn btn-ghost">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Detail view -->
  <div id="detail-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal detail-modal">
      <div class="modal-header">
        <h2 id="detail-title" class="visually-hidden">名刺詳細</h2>
        <button id="btn-detail-close" class="icon-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="detail-content" class="detail-content"></div>
      <div class="detail-actions">
        <button id="btn-detail-edit" class="btn btn-outline">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
          編集
        </button>
        <button id="btn-detail-delete" class="btn btn-danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          削除
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
